name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup pnpm
        uses: pnpm/action-setup@v3
        # No `version:` on purpose — action-setup then reads `packageManager`
        # from package.json, so CI uses the exact pnpm that produced
        # pnpm-lock.yaml and the committed dist/. pnpm majors hoist
        # node_modules differently, which changes what ncc bundles, so a
        # local/CI mismatch makes the "Check dist" step unsatisfiable.
      -
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match the Node used to build the committed dist/. ncc output
          # differs between Node majors, so a mismatch makes the "Check dist"
          # step below unsatisfiable: the bundle can be correct on one version
          # and dirty on the other. 24 matches poweron-pipelines and the Node
          # that GitHub now actually runs node20 actions on.
          node-version: 24
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@libum-llc'
      -
        name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NGUYENDON_GITHUB_TOKEN }}
      -
        name: Lint
        run: pnpm lint
      -
        name: Test
        run: pnpm test
      -
        name: Build
        run: pnpm build
      -
        # `action.yml` ships `dist/index.js`, so the committed bundle - not
        # src/ - is what consumers actually run. The `Build` step above just
        # rewrote dist/ in place, so anything git now reports as dirty or
        # untracked under dist/ is a difference between what is committed and
        # what src/ produces.
        #
        # This step previously snapshotted dist/ *after* the build, rebuilt,
        # and compared the two snapshots. Both were post-build, so it compared
        # the build to itself: it proved reproducibility and could never detect
        # a stale committed dist/. That blind spot is why a v1 bundle survived
        # undetected through six green builds. Do not reorder `Build` after
        # this step, and do not reintroduce a post-build snapshot as the
        # baseline - the committed tree is the only meaningful baseline.
        name: Check dist
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "Error: the committed dist/ does not match a fresh build of src/"
            echo "Please run 'pnpm build' and commit the result."
            echo ""
            git status --porcelain -- dist/
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ matches a fresh build of src/"
      -
        # The task runner now lives in `@libum-llc/pipelines-core`, a private
        # GitHub Packages dependency. `action.yml` ships only `dist/index.js` -
        # consumers never run `pnpm install`, and they have no credentials for
        # our registry - so the package MUST be inlined by ncc rather than left
        # as a runtime `require`. A leftover `require("@libum-llc/...")` would
        # throw MODULE_NOT_FOUND on every consumer while still passing every
        # test here. Assert the bundle is non-vacuous (it really contains core's
        # runner) and that neither private package survives as a bare require.
        name: Assert the core package was inlined into the bundle
        run: |
          # The marker must be a string that ONLY core's runner contributes.
          # "Successfully validated all changed PowerOns" looked right but also
          # appears in a comment in src/main.ts explaining a past hang, which ncc
          # copies into the bundle verbatim - so it survived even when core was
          # externalized and the sentinel passed on a bundle that would have
          # thrown MODULE_NOT_FOUND for every consumer. Verified: this marker
          # occurs once in the real bundle and zero times in one built with
          # --external @libum-llc/pipelines-core.
          if [ "$(grep -c 'No changed PowerOn files found comparing' dist/index.js)" -eq 0 ]; then
            echo "Error: dist/index.js does not contain core's task runner - this check would be vacuous"
            exit 1
          fi
          for pkg in @libum-llc/pipelines-core @libum-llc/symitar; do
            if [ "$(grep -c "require(\"$pkg\")" dist/index.js)" -ne 0 ]; then
              echo "Error: dist/index.js still requires $pkg at runtime"
              echo "ncc did not inline it; consumers of this action cannot resolve it"
              exit 1
            fi
          done
          node -e "require('./dist/index.js')"
          echo "Core is inlined; bundle contains the task runner"
      -
        # `main.ts` self-executes under `if (require.main === module)`, which
        # only works in the bundle because ncc rewrites it to
        # `require.main === require.cache[eval('__filename')]`. That rewrite is
        # applied by ncc's relocate-loader to the *entry module*, and it is
        # sensitive to what else that module contains: adding one exported
        # helper function to `main.ts` was enough to lose it, leaving webpack's
        # own `__nccwpck_require__.c[__nccwpck_require__.s] === module`, which
        # is true under a plain `require()` too. The bundle then ran the whole
        # action on import.
        #
        # Both directions are asserted because both are silent failures in
        # opposite directions: the wrong rewrite makes `require()` execute the
        # action, and a missing rewrite (ncc also has a branch that replaces
        # the comparison with `false`) makes `node dist/index.js` a no-op that
        # exits 0 having validated nothing.
        name: Assert the entry guard survived bundling
        run: |
          # Counted, not merely grepped for: a source comment quoting the
          # expression would otherwise satisfy a bare grep on its own. That is
          # not hypothetical - the core-inlining marker above was vacuous for
          # exactly that reason. The pattern tolerates minifier output, which
          # emits `require.main===require.cache[eval("__filename")]` with double
          # quotes and no spaces, so it must not be anchored or spaced.
          guards=$(grep -oE 'require\.main *=== *require\.cache\[eval\((\x27|")__filename(\x27|")\)\]' dist/index.js | wc -l | tr -d ' ')
          if [ "$guards" -ne 1 ]; then
            echo "Error: expected exactly 1 rewritten entry guard in dist/index.js, found $guards"
            echo "Every 'require.main' / '=== module' occurrence:"
            grep -oE '.{30}require\.main.{60}|.{30}=== *module.{30}' dist/index.js || echo "  (none at all)"
            echo "Keep src/main.ts minimal - move helpers into src/lib/."
            exit 1
          fi
          if node -e "require('./dist/index.js')" 2>&1 | grep -q 'Starting PowerOn validation'; then
            echo "Error: requiring dist/index.js executed the action"
            echo "The entry guard is true under require(), not just as a process entry point."
            exit 1
          fi
          echo "Entry guard intact: self-executes as a process entry point, inert under require()"
      -
        # The build ships `dist/index.js` minified and emits no source map.
        # Both are asserted because both are easy to lose by accident: a map
        # returns the moment `--source-map` is added back, and minification is
        # a single flag away from being dropped. Neither failure is visible in
        # a diff of `src/`.
        name: Assert the bundle ships minified and mapless
        run: |
          if [ -n "$(find dist -name '*.map' -print -quit)" ]; then
            echo "Error: dist/ contains a source map"
            find dist -name '*.map'
            echo "Source maps embed sourcesContent - a readable copy of every bundled dependency."
            echo "Build without --source-map."
            exit 1
          fi
          if grep -rlq "sourcesContent" dist/ 2>/dev/null; then
            echo "Error: dist/ contains embedded original sources (sourcesContent)"
            grep -rl "sourcesContent" dist/
            exit 1
          fi
          if grep -q "sourceMappingURL" dist/index.js; then
            echo "Error: dist/index.js still references a source map"
            exit 1
          fi
          # Minified output is a handful of very long lines. Unminified ncc
          # output averages ~33 bytes per line, minified is ~380,000; 1000 sits
          # far from both and needs no maintenance.
          bytes=$(wc -c < dist/index.js)
          lines=$(wc -l < dist/index.js)
          ratio=$(( bytes / (lines > 0 ? lines : 1) ))
          if [ "$ratio" -lt 1000 ]; then
            echo "Error: dist/index.js looks unminified ($ratio bytes per line, expected >1000)"
            echo "The build must pass --minify; see package.json."
            exit 1
          fi
          echo "Bundle is minified ($ratio bytes/line) with no source map"
      -
        # main.ts only self-executes under `if (require.main === module)`,
        # which relies on ncc rewriting that check to
        # `require.main === require.cache[eval('__filename')]`. If a future ncc
        # version changes that rewrite, the bundle silently becomes a no-op that
        # exits 0 without validating anything - a green, fast, wrong build. Run
        # the bundle exactly the way the action runtime does (as the process
        # entry point, not via `require()` from another script) and assert both
        # that the startup banner reaches stdout and that it fails loudly given
        # bogus credentials.
        #
        # This makes one real network call to the Libum license server with an
        # invalid API key, which is acceptable once per build. The Symitar host
        # input is pointed at 192.0.2.1 (TEST-NET-1, RFC 5737) so nothing here
        # ever addresses a real Symitar host.
        name: Smoke test the bundle as the actual action entry point
        run: |
          set +e
          output=$(env \
            INPUT_SYMITAR-HOSTNAME=192.0.2.1 \
            INPUT_SYM-NUMBER=99 \
            INPUT_SYMITAR-USER-NUMBER=9999 \
            INPUT_SYMITAR-USER-PASSWORD=smoke-test-password \
            INPUT_SSH-USERNAME=smoke-test-user \
            INPUT_SSH-PASSWORD=smoke-test-password \
            INPUT_API-KEY=sk-smoke-test-bogus-key \
            INPUT_CONNECTION-TYPE=https \
            INPUT_SYMITAR-APP-PORT=4299 \
            INPUT_POWERON-DIRECTORY=REPWRITERSPECS/ \
            INPUT_SYNC-METHOD=sftp \
            GITHUB_WORKSPACE=/tmp \
            GITHUB_REF=refs/heads/main \
            node dist/index.js 2>&1)
          exit_code=$?
          echo "$output"
          set -e
          if ! echo "$output" | grep -q 'Starting PowerOn validation'; then
            echo "Error: startup banner never reached stdout - main.ts's require.main guard may be broken"
            exit 1
          fi
          if [ "$exit_code" -eq 0 ]; then
            echo "Error: smoke run exited 0 with bogus credentials - the action may be a silent no-op"
            exit 1
          fi
          echo "Smoke run behaved correctly: banner printed, exited non-zero ($exit_code)"
