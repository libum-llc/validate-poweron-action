name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup pnpm
        uses: pnpm/action-setup@v3
        # No `version:` on purpose — action-setup then reads `packageManager`
        # from package.json, so CI uses the exact pnpm that produced
        # pnpm-lock.yaml and the committed dist/. pnpm majors hoist
        # node_modules differently, which changes what ncc bundles, so a
        # local/CI mismatch makes the "Check dist" step unsatisfiable.
      -
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match the Node used to build the committed dist/. ncc output
          # differs between Node majors, so a mismatch makes the "Check dist"
          # step below unsatisfiable: the bundle can be correct on one version
          # and dirty on the other. 24 matches poweron-pipelines and the Node
          # that GitHub now actually runs node20 actions on.
          node-version: 24
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@libum-llc'
      -
        name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NGUYENDON_GITHUB_TOKEN }}
      -
        name: Lint
        run: pnpm lint
      -
        name: Test
        run: pnpm test
      -
        name: Build
        run: pnpm build
      -
        # `action.yml` ships `dist/index.js`, so the committed bundle - not
        # src/ - is what consumers actually run. The `Build` step above just
        # rewrote dist/ in place, so anything git now reports as dirty or
        # untracked under dist/ is a difference between what is committed and
        # what src/ produces.
        #
        # This step previously snapshotted dist/ *after* the build, rebuilt,
        # and compared the two snapshots. Both were post-build, so it compared
        # the build to itself: it proved reproducibility and could never detect
        # a stale committed dist/. That blind spot is why a v1 bundle survived
        # undetected through six green builds. Do not reorder `Build` after
        # this step, and do not reintroduce a post-build snapshot as the
        # baseline - the committed tree is the only meaningful baseline.
        name: Check dist
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "Error: the committed dist/ does not match a fresh build of src/"
            echo "Please run 'pnpm build' and commit the result."
            echo ""
            git status --porcelain -- dist/
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ matches a fresh build of src/"
      -
        # The task runner now lives in `@libum-llc/pipelines-core`, a private
        # GitHub Packages dependency. `action.yml` ships only `dist/index.js` -
        # consumers never run `pnpm install`, and they have no credentials for
        # our registry - so the package MUST be inlined by ncc rather than left
        # as a runtime `require`. A leftover `require("@libum-llc/...")` would
        # throw MODULE_NOT_FOUND on every consumer while still passing every
        # test here. Assert the bundle is non-vacuous (it really contains core's
        # runner) and that neither private package survives as a bare require.
        name: Assert the core package was inlined into the bundle
        run: |
          if [ "$(grep -c 'Successfully validated all changed PowerOns' dist/index.js)" -eq 0 ]; then
            echo "Error: dist/index.js does not contain core's task runner - this check would be vacuous"
            exit 1
          fi
          for pkg in @libum-llc/pipelines-core @libum-llc/symitar; do
            if [ "$(grep -c "require(\"$pkg\")" dist/index.js)" -ne 0 ]; then
              echo "Error: dist/index.js still requires $pkg at runtime"
              echo "ncc did not inline it; consumers of this action cannot resolve it"
              exit 1
            fi
          done
          node -e "require('./dist/index.js')"
          echo "Core is inlined; bundle contains the task runner"
      -
        # main.ts only self-executes under `if (require.main === module)`,
        # which relies on ncc rewriting that check to
        # `require.main === require.cache[eval('__filename')]`. If a future ncc
        # version changes that rewrite, the bundle silently becomes a no-op that
        # exits 0 without validating anything - a green, fast, wrong build. Run
        # the bundle exactly the way the action runtime does (as the process
        # entry point, not via `require()` from another script) and assert both
        # that the startup banner reaches stdout and that it fails loudly given
        # bogus credentials.
        #
        # This makes one real network call to the Libum license server with an
        # invalid API key, which is acceptable once per build. The Symitar host
        # input is pointed at 192.0.2.1 (TEST-NET-1, RFC 5737) so nothing here
        # ever addresses a real Symitar host.
        name: Smoke test the bundle as the actual action entry point
        run: |
          set +e
          output=$(env \
            INPUT_SYMITAR-HOSTNAME=192.0.2.1 \
            INPUT_SYM-NUMBER=99 \
            INPUT_SYMITAR-USER-NUMBER=9999 \
            INPUT_SYMITAR-USER-PASSWORD=smoke-test-password \
            INPUT_SSH-USERNAME=smoke-test-user \
            INPUT_SSH-PASSWORD=smoke-test-password \
            INPUT_API-KEY=sk-smoke-test-bogus-key \
            INPUT_CONNECTION-TYPE=https \
            INPUT_SYMITAR-APP-PORT=4299 \
            INPUT_POWERON-DIRECTORY=REPWRITERSPECS/ \
            INPUT_SYNC-METHOD=sftp \
            GITHUB_WORKSPACE=/tmp \
            GITHUB_REF=refs/heads/main \
            node dist/index.js 2>&1)
          exit_code=$?
          echo "$output"
          set -e
          if ! echo "$output" | grep -q 'Starting PowerOn validation'; then
            echo "Error: startup banner never reached stdout - main.ts's require.main guard may be broken"
            exit 1
          fi
          if [ "$exit_code" -eq 0 ]; then
            echo "Error: smoke run exited 0 with bogus credentials - the action may be a silent no-op"
            exit 1
          fi
          echo "Smoke run behaved correctly: banner printed, exited non-zero ($exit_code)"
