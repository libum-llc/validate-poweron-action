name: live-integration

# Runs on branch pushes and on manual dispatch.
#
# WHY `push` AND NOT `pull_request`: this suite exists to exercise
# hash-comparison — comparing the local fixture directory against what is
# actually deployed on the Symitar host. Which mode the action picks is
# decided by core's `determineValidationMode(targetBranch, buildBranch)`:
# git-diff if `targetBranch` matches `refs/heads/*`, else hash-comparison if
# `buildBranch` does, else none. On a `pull_request` run the action resolves
# `target-branch` from `GITHUB_BASE_REF` automatically, so it always chose
# git-diff and never asked Symitar anything — and it *passed* only because the
# fixtures happened to be new files in the pull request that added them. On the
# first pull request that did not touch
# `.github/workflows/live-integration-fixtures/`, `git diff` would return zero
# files and every `1/1/0` assertion below would fail.
#
# A `push` run has no `GITHUB_BASE_REF` and a `GITHUB_REF` of
# `refs/heads/<branch>`, which is exactly the shape hash-comparison needs. This
# mirrors how `poweron-pipelines` runs the same task against the same Sym
# (`src/integration/live/config.ts` sets `BUILD_SOURCEBRANCH: refs/heads/main`
# and no target branch).
#
# git-diff mode is not left uncovered: `src/lib/__tests__/utils.test.ts`
# exercises `getChangedFilesInDir` against real `git diff --name-status`
# output, including the rename/copy records and the missing-ref failure. What
# only a live run can prove is the Symitar side, which is what this is for.
#
# `push` runs appear as checks on the pull request whose head is that commit,
# so this still gates review the way the `pull_request` trigger did. `main` is
# excluded: the merge commit re-tests nothing this run has not already tested,
# and every run occupies the one runner that can reach SYM 627.
#
# SECURITY: this repo is public and this workflow runs on a self-hosted runner
# with network access to the Symitar host. `push` cannot be triggered from a
# fork at all — only someone with write access can push a branch here — so the
# fork exposure that made `pull_request` delicate does not arise. The fork
# guard in the job's `if:` below is kept anyway: it costs nothing and it is
# what makes re-adding a `pull_request` trigger safe rather than silently
# dangerous. A job-level `if:` is evaluated before a runner is assigned, so a
# guarded event is skipped without ever occupying the runner or reaching
# Symitar.
#
# Do not switch to `pull_request_target` — that trigger runs against the base
# repo's context with secrets available and would defeat the guard entirely.
#
# Recommended defence in depth at the repo level: set Actions →
# "Fork pull request workflows from outside collaborators" to
# "Require approval for all outside collaborators".
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Shared across every workflow in this repo that talks to a live Symitar host,
# so two runs (this workflow re-triggered, or a future Symitar-touching
# workflow) never race against the same Sym at once.
#
# KNOWN LIMITATION: GitHub Actions scopes concurrency groups per repository.
# This group only serializes runs within validate-poweron-action - it cannot
# and does not prevent a simultaneous poweron-pipelines or
# synchronize-symitar-action live-integration run from also hitting SYM 627,
# even though all three target the same physical host. There is no
# workflow-level fix for this (an external cross-repo lock would add more
# failure modes than it removes). The operator must ensure the `Symitar`
# runner group's actual runner(s) are shared/serialized across all three
# repositories - e.g. by pointing them at the same physical self-hosted
# runner, so the runner itself queues jobs one at a time. Confirm this at
# runner-group setup time, not by editing this file.
concurrency:
  group: symitar-live-integration
  cancel-in-progress: false

# CONFIGURATION SPLIT: the three real credentials (API key, AIX password,
# Symitar user password) are org secrets and are redacted from these logs.
# The host-identifying values below are hardcoded literals, matching how
# poweron-pipelines does it in src/integration/live/config.ts
# (LIVE_SYMITAR_DEFAULTS) — kept identical across both repos so the
# live-integration setup reads the same way in each.
#
# Note this repo is public, so those literals are visible in source and in
# git history. That is an accepted trade for infrastructure identifiers that
# sit behind a firewall. Never put anything credential-shaped here —
# passwords, API keys and tokens belong in org secrets, which are redacted.

jobs:
  validate-poweron:
    name: ValidatePowerOn Live Integration
    # Load-bearing, not defence in depth: the `pull_request` trigger above is
    # only safe because of the fork check on the last line. Dependabot is also
    # excluded — it has no reason to touch a live Sym.
    if: >-
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.ref_name, 'dependabot/') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    environment: symitar-integration
    runs-on:
      group: Symitar
      labels: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Not required by this workflow — these steps run in
          # hash-comparison mode and never shell out to `git diff`. Kept
          # deliberately: it is what a consumer's workflow must set (the
          # action resolves `target-branch` from GITHUB_BASE_REF on
          # pull_request runs and diffs `origin/<base>...`, which a depth-1
          # clone cannot resolve), so checking out the way the README tells
          # consumers to keeps this file honest about the documented setup.
          fetch-depth: 0

      # No pnpm/node/build steps here on purpose. The whole point of this
      # workflow is to exercise the action exactly as a consumer would:
      # action.yml's input plumbing and the dist/index.js bundle already
      # committed to this ref, not a freshly recompiled copy. `pnpm build`
      # producing a different bundle than what's committed is covered by
      # ci.yml's "Check dist" step, not here.

      - name: Prepare no-op fixture directory
        # A truly empty, uncommitted directory (not even a .gitkeep) so the
        # Symitar client's local file listing returns zero entries. Git can't
        # track an empty directory, and a .gitkeep file would itself show up
        # as a locally-present, remotely-absent "changed" file and break the
        # no-op assertion below.
        run: mkdir -p "${GITHUB_WORKSPACE}/live-integration-noop-scratch"

      - name: 'HTTPS: known-valid PowerOn'
        id: https-valid
        uses: ./
        with:
          symitar-hostname: '74.200.48.18'
          sym-number: '627'
          symitar-user-number: '1999'
          symitar-user-password: ${{ secrets.SYMITAR_USER_PASSWORD }}
          ssh-username: 'libum627'
          ssh-password: ${{ secrets.SYMITAR_PASSWORD }}
          api-key: ${{ secrets.POWERON_PIPELINES_API_KEY }}
          connection-type: https
          symitar-app-port: '42627'
          poweron-directory: .github/workflows/live-integration-fixtures/valid/
          sync-method: sftp

      - name: 'Assert: HTTPS known-valid outputs'
        run: |
          validated="${{ steps.https-valid.outputs.files-validated }}"
          passed="${{ steps.https-valid.outputs.files-passed }}"
          failed="${{ steps.https-valid.outputs.files-failed }}"
          echo "files-validated=$validated files-passed=$passed files-failed=$failed"
          if [ "$validated" != "1" ] || [ "$passed" != "1" ] || [ "$failed" != "0" ]; then
            echo "::error::HTTPS known-valid run produced unexpected outputs (expected 1/1/0)"
            exit 1
          fi

      - name: 'SSH: known-valid PowerOn'
        id: ssh-valid
        uses: ./
        with:
          symitar-hostname: '74.200.48.18'
          sym-number: '627'
          symitar-user-number: '1999'
          symitar-user-password: ${{ secrets.SYMITAR_USER_PASSWORD }}
          ssh-username: 'libum627'
          ssh-password: ${{ secrets.SYMITAR_PASSWORD }}
          api-key: ${{ secrets.POWERON_PIPELINES_API_KEY }}
          connection-type: ssh
          poweron-directory: .github/workflows/live-integration-fixtures/valid/
          sync-method: sftp

      - name: 'Assert: SSH known-valid outputs'
        run: |
          validated="${{ steps.ssh-valid.outputs.files-validated }}"
          passed="${{ steps.ssh-valid.outputs.files-passed }}"
          failed="${{ steps.ssh-valid.outputs.files-failed }}"
          echo "files-validated=$validated files-passed=$passed files-failed=$failed"
          if [ "$validated" != "1" ] || [ "$passed" != "1" ] || [ "$failed" != "0" ]; then
            echo "::error::SSH known-valid run produced unexpected outputs (expected 1/1/0)"
            exit 1
          fi

      - name: 'SSH: known-invalid PowerOn (expected to fail)'
        id: ssh-invalid
        continue-on-error: true
        uses: ./
        with:
          symitar-hostname: '74.200.48.18'
          sym-number: '627'
          symitar-user-number: '1999'
          symitar-user-password: ${{ secrets.SYMITAR_USER_PASSWORD }}
          ssh-username: 'libum627'
          ssh-password: ${{ secrets.SYMITAR_PASSWORD }}
          api-key: ${{ secrets.POWERON_PIPELINES_API_KEY }}
          connection-type: ssh
          poweron-directory: .github/workflows/live-integration-fixtures/invalid/
          sync-method: sftp
          # The only step that runs with debug enabled. This is a public repo
          # with world-readable Actions logs, and debug-level Symitar output is
          # far broader than these assertions need. It is kept here, on the
          # step expected to fail, because that is where the extra detail
          # actually helps diagnose a regression - and it keeps the debug code
          # path itself exercised at least once per run.
          debug: 'true'

      - name: 'Assert: SSH known-invalid outputs'
        run: |
          outcome="${{ steps.ssh-invalid.outcome }}"
          validated="${{ steps.ssh-invalid.outputs.files-validated }}"
          passed="${{ steps.ssh-invalid.outputs.files-passed }}"
          failed="${{ steps.ssh-invalid.outputs.files-failed }}"
          echo "outcome=$outcome files-validated=$validated files-passed=$passed files-failed=$failed"
          if [ "$outcome" != "failure" ]; then
            echo "::error::known-invalid run was expected to fail the step but outcome was '$outcome'"
            exit 1
          fi
          if [ "$failed" = "0" ] || [ -z "$failed" ]; then
            echo "::error::known-invalid run did not report a non-zero files-failed count"
            exit 1
          fi

      - name: 'HTTPS: no-op (no changed PowerOns)'
        id: https-noop
        uses: ./
        with:
          symitar-hostname: '74.200.48.18'
          sym-number: '627'
          symitar-user-number: '1999'
          symitar-user-password: ${{ secrets.SYMITAR_USER_PASSWORD }}
          ssh-username: 'libum627'
          ssh-password: ${{ secrets.SYMITAR_PASSWORD }}
          api-key: ${{ secrets.POWERON_PIPELINES_API_KEY }}
          connection-type: https
          symitar-app-port: '42627'
          poweron-directory: live-integration-noop-scratch/
          sync-method: sftp

      - name: 'Assert: no-op outputs'
        run: |
          validated="${{ steps.https-noop.outputs.files-validated }}"
          passed="${{ steps.https-noop.outputs.files-passed }}"
          failed="${{ steps.https-noop.outputs.files-failed }}"
          echo "files-validated=$validated files-passed=$passed files-failed=$failed"
          if [ "$validated" != "0" ] || [ "$passed" != "0" ] || [ "$failed" != "0" ]; then
            echo "::error::no-op run produced unexpected outputs (expected 0/0/0)"
            exit 1
          fi

      - name: Write Integration Summary
        if: always()
        run: |
          cat <<'MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          ## ValidatePowerOn Live Integration

          **Target:** SYM 627<br>
          **Mode:** hash-comparison against the deployed Symitar host. No `target-branch` is set, and a `push` run has no `GITHUB_BASE_REF` for the action to default to, so change detection goes to Symitar rather than to `git diff`.<br>
          **Connections:** HTTPS and SSH<br>
          **Action ref:** `uses: ./` (action.yml + the committed dist/ bundle on this checkout)

          | Scenario | Connection | Coverage |
          | --- | --- | --- |
          | Known-valid PowerOn | HTTPS | `files-validated`/`files-passed`/`files-failed` = 1/1/0 |
          | Known-valid PowerOn | SSH | `files-validated`/`files-passed`/`files-failed` = 1/1/0 |
          | Known-invalid PowerOn | SSH | Step fails, `files-failed` is non-zero |
          | No changed PowerOns | HTTPS | Step succeeds with `files-validated`/`files-passed`/`files-failed` = 0/0/0 |
          MARKDOWN
