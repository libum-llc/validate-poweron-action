name: live-integration

# One reviewed connection per run. Compatibility selectors and failures are
# tested offline. Do not restore automatic push/PR triggers or login retries.
# This lock is repository-scoped: serialize with other Symitar suites at the
# shared runner/operator level before dispatching.
on:
  workflow_dispatch:

concurrency:
  group: symitar-live-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  symitar:
    name: Symitar Connector Live Check
    environment: symitar-integration
    runs-on:
      group: Symitar
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required configuration without connecting
        shell: bash
        env:
          HOST_KEY: ${{ vars.SYMITAR_SSH_HOST_KEY }}
          AIX_PASSWORD: ${{ secrets.SYMITAR_PASSWORD }}
          SYM_PASSWORD: ${{ secrets.SYMITAR_USER_PASSWORD }}
          API_KEY: ${{ secrets.POWERON_PIPELINES_API_KEY }}
        run: |
          for name in HOST_KEY AIX_PASSWORD SYM_PASSWORD API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; no live connection attempted."
              exit 1
            fi
          done

      - name: Validate known-valid PowerOn once
        id: live
        uses: ./
        # Manual branch dispatch selects hash comparison. Validation may
        # temporarily upload/compile this fixture; core owns cleanup. A failure
        # stops this run. Inspect it before authorizing another live attempt.
        with:
          symitar-hostname: '74.200.48.18'
          sym-number: '627'
          symitar-user-number: '1999'
          symitar-user-password: ${{ secrets.SYMITAR_USER_PASSWORD }}
          ssh-username: 'libum627'
          ssh-password: ${{ secrets.SYMITAR_PASSWORD }}
          ssh-host-key: ${{ vars.SYMITAR_SSH_HOST_KEY }}
          api-key: ${{ secrets.POWERON_PIPELINES_API_KEY }}
          poweron-directory: .github/workflows/live-integration-fixtures/valid/

      - name: Check validation outputs
        shell: bash
        env:
          VALIDATED: ${{ steps.live.outputs.files-validated }}
          PASSED: ${{ steps.live.outputs.files-passed }}
          FAILED: ${{ steps.live.outputs.files-failed }}
        run: |
          test "$VALIDATED/$PASSED/$FAILED" = '1/1/0'
