name: 'Validate PowerOn'
description: 'GitHub Action to validate a PowerOn on the Jack Henry™ credit union core platform'
author: 'libum-llc'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  symitar-hostname:
    description: 'The endpoint by which you connect to the Symitar host'
    required: true

  ssh-host-key:
    description: 'Approved SSH host public key base64 field. Otherwise the agent account must already trust the host in known_hosts with ssh-keygen available. Unknown or changed trust fails without prompting.'
    required: false

  sym-number:
    description: 'The directory (aka Sym) number for your connection'
    required: true

  symitar-user-number:
    description: 'Your Symitar user number (just the number)'
    required: true

  symitar-user-password:
    description: 'Your Symitar password (just the password)'
    required: true

  ssh-username:
    description: 'AIX SSH credential required by the current Symitar connector regardless of legacy connection-type.'
    required: true

  ssh-password:
    description: 'AIX SSH credential required by the current Symitar connector regardless of legacy connection-type.'
    required: true

  ssh-port:
    description: 'The port to connect to the SSH server'
    required: false
    default: '22'

  api-key:
    description: 'Your PowerOn Pipelines API Key from Libum Portal (https://portal.libum.io)'
    required: true

  symitar-app-port:
    description: 'Compatibility input; accepted but ignored in v2.2. Configure ssh-port for the current Symitar connector transport.'
    required: false

  connection-type:
    description: 'Compatibility input; accepted but ignored in v2.2. The Symitar connector currently uses SSH regardless of this value.'
    required: false
    default: 'ssh'

  poweron-directory:
    description: 'The directory in the repository to monitor PowerOn changes in'
    required: false
    default: 'REPWRITERSPECS/'

  target-branch:
    description: 'Bare branch name to compare against for changed files (e.g., main). Defaults to the pull request base branch on pull_request events. The "origin/" and "refs/heads/" prefixes are rejected with an error.'
    required: false

  validate-ignore:
    description: 'List of PowerOn filenames to ignore during validation. Accepts a comma-delimited string.'
    required: false
    default: ''

  preserve-server-files:
    description: 'List of exact filenames or glob patterns to skip during validation because they are preserved from the server. Accepts a comma-delimited string.'
    required: false
    default: ''

  debug:
    description: 'Enable debug logging for Symitar clients'
    required: false
    default: 'false'

  sync-method:
    description: 'Compatibility comparison selector: sftp or rsync accepted; v2.2 always compares with SFTP checksums'
    required: false
    default: 'sftp'

outputs:
  files-validated:
    description: 'Number of PowerOn files validated'

  files-passed:
    description: 'Number of PowerOn files that passed validation'

  files-failed:
    description: 'Number of PowerOn files that failed validation'

runs:
  # node24: GitHub has deprecated node20 for actions and already executes
  # node20 actions on Node 24, so declaring it explicitly removes the
  # deprecation warning and matches the Node that CI builds dist/ with.
  using: node24
  main: dist/index.js
